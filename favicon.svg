<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1040" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="nfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background — deep navy with purple tint, rounded corners -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bgGrad)" />

  <!-- Subtle border glow -->
  <rect width="32" height="32" rx="7" ry="7"
        fill="none" stroke="rgba(167,139,250,0.3)" stroke-width="0.75" />

  <!-- ── Letter N ──
       Left bar:  x 5–7,  y 9–23
       Diagonal:  (7,9) → (13,23)  stroke-width ≈ 2.4
       Right bar: x 13–15, y 9–23
  -->
  <g fill="url(#nfGrad)" stroke="none">
    <!-- Left vertical bar -->
    <rect x="5" y="9" width="2.2" height="14" rx="0.4"/>
    <!-- Right vertical bar -->
    <rect x="12.8" y="9" width="2.2" height="14" rx="0.4"/>
  </g>
  <!-- Diagonal stroke (rendered as a line so the width stays uniform) -->
  <line x1="7.2" y1="9.5" x2="12.8" y2="22.5"
        stroke="url(#nfGrad)" stroke-width="2.4"
        stroke-linecap="square"/>

  <!-- ── Letter F ──
       Vertical bar: x 17–19,  y 9–23
       Top bar:      x 17–25,  y 9–11
       Mid bar:      x 17–23.5, y 15–17
  -->
  <g fill="url(#nfGrad)" stroke="none">
    <!-- Vertical bar -->
    <rect x="17" y="9" width="2.2" height="14" rx="0.4"/>
    <!-- Top horizontal bar -->
    <rect x="17" y="9" width="8.5" height="2.2" rx="0.4"/>
    <!-- Middle horizontal bar -->
    <rect x="17" y="15" width="7" height="2.0" rx="0.4"/>
  </g>
</svg>
